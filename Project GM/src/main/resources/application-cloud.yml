spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}

  jpa:
    show-sql: false

  http:
    client:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENAI_READ_TIMEOUT:20s}

openai:
  enabled: ${OPENAI_ENABLED:true}
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2048}
  temperature: ${OPENAI_TEMPERATURE:0.7}

security:
  development-user-enabled: false
  jwt-issuer-uri: ${JWT_ISSUER_URI}
  jwt-audience: ${JWT_AUDIENCE}
