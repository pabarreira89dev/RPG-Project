spring:
  profiles:
    on-profile: cloud
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}

  jpa:
    show-sql: false

  http:
    client:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT}
      read-timeout: ${OPENAI_READ_TIMEOUT}

openai:
  enabled: ${OPENAI_ENABLED}
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL}
  model: ${OPENAI_MODEL}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS}
  temperature: ${OPENAI_TEMPERATURE}

security:
  development-user-enabled: false
  jwt-issuer-uri: ${JWT_ISSUER_URI}
  jwt-audience: ${JWT_AUDIENCE}
