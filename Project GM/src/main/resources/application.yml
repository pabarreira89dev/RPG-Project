spring:
  application:
    name: project_gm
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must only validate it, never auto-create/alter tables.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # MySQL has no native UUID type; force CHAR(36) instead of Hibernate's BINARY(16) default
        # to match the Flyway-managed schema (CHAR(36) columns).
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true

server:
  servlet:
    context-path: /project_gm
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
