spring:
  profiles:
    on-profile: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

  http:
    client:
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT}
      read-timeout: ${OPENAI_READ_TIMEOUT}

logging:
  level:
    pab.rpg: DEBUG

# Requiere OPENAI_API_KEY y OPENAI_MODEL como variables de entorno; nunca hardcodear la API key aquí.
openai:
  enabled: ${OPENAI_ENABLED}
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL}
  model: ${OPENAI_MODEL}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS}
  temperature: ${OPENAI_TEMPERATURE}

# /actuator/shutdown solo se expone en local: lo usa la suite E2E de "Project GM automatics" para reiniciar la app y probar persistencia real.
management:
  endpoints:
    web:
      exposure:
        include: health,info,shutdown,metrics
  endpoint:
    shutdown:
      enabled: true

security:
  development-user-enabled: true
